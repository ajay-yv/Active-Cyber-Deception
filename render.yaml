services:
  - type: web
    name: healthcare-ehr-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: OTP_SMS_PROVIDER
        value: brevo
      - key: TWILIO_DEFAULT_COUNTRY_CODE
        value: "91"
      - key: CORS_ALLOWED_ORIGINS
        value: https://frontend-eosin-omega-65.vercel.app
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_EMAIL_SENDER
        sync: false
      - key: BREVO_EMAIL_SENDER_NAME
        value: Healthcare EHR Portal
      - key: BREVO_SMS_SENDER
        value: EHR
      - key: SECRET_KEY
        generateValue: true
